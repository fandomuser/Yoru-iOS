name: Yoru iOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Yoru iOS Client
    runs-on: macos-14

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Setup Dummy Build Configuration
        run: |
          # Inject non-sensitive dummy build credentials so CI builds succeed without real secrets
          mkdir -p Yoru/Resources
          cat << 'EOF' > Yoru/Resources/Config.xcconfig
          YORU_TELEGRAM_API_ID = 12345678
          YORU_TELEGRAM_API_HASH = "0123456789abcdef0123456789abcdef"
          PRODUCT_BUNDLE_IDENTIFIER = com.yoru.client
          PRODUCT_NAME = Yoru
          MARKETING_VERSION = 0.1.0
          CURRENT_PROJECT_VERSION = 1
          TARGETED_DEVICE_FAMILY = 1
          IPHONEOS_DEPLOYMENT_TARGET = 17.0
          SWIFT_VERSION = 5.10
          ENABLE_USER_SCRIPT_SANDBOXING = YES
          EOF

      - name: Setup TDLib Framework
        run: |
          chmod +x Scripts/setup_framework.sh
          bash Scripts/setup_framework.sh

      - name: Run Python Codebase & Syntax Verification
        run: |
          python3 Scripts/verify_structure.py
          python3 Scripts/static_check.py

      - name: Run Swift Package Unit Tests
        run: |
          swift test -v

      - name: Validate Xcode Project Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Yoru.xcodeproj \
            -scheme Yoru \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO
