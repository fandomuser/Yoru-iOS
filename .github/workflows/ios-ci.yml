name: Yoru iOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Yoru iOS Client
    runs-on: macos-15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "=== Discovering Installed Xcode Applications on Runner ==="
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          echo "=== Active Toolchain ==="
          xcodebuild -version
          swift --version

      - name: Setup Dummy Build Configuration
        run: |
          # Inject non-sensitive dummy build credentials so CI builds succeed without real secrets
          mkdir -p Yoru/Resources
          cat << 'EOF' > Yoru/Resources/Config.xcconfig
          YORU_TELEGRAM_API_ID = 12345678
          YORU_TELEGRAM_API_HASH = "0123456789abcdef0123456789abcdef"
          PRODUCT_BUNDLE_IDENTIFIER = com.yoru.client
          PRODUCT_NAME = Yoru
          MARKETING_VERSION = 0.1.0
          CURRENT_PROJECT_VERSION = 1
          TARGETED_DEVICE_FAMILY = 1
          IPHONEOS_DEPLOYMENT_TARGET = 17.0
          SWIFT_VERSION = 5.0
          ENABLE_USER_SCRIPT_SANDBOXING = YES
          EOF

      - name: Fetch and Verify Real Official TDLib XCFramework
        run: |
          chmod +x Scripts/fetch_real_tdlib.sh
          bash Scripts/fetch_real_tdlib.sh
          # Fail hard if real binary is missing or a mock
          echo "=== Inspecting Real TDLib Binary Architecture Slices ==="
          REAL_BIN=$(find Yoru/Frameworks/TDLibFramework.xcframework -name "TDLibFramework" -o -name "libtdjson.dylib" | head -n 1)
          if [ -z "$REAL_BIN" ]; then
            echo "[!] ERROR: No TDLib binary found in Yoru/Frameworks/TDLibFramework.xcframework"
            exit 1
          fi
          lipo -info "$REAL_BIN"
          file "$REAL_BIN"
          ls -lh "$REAL_BIN"

      - name: Run Source Structure and Lexical Lint
        run: |
          python3 Scripts/verify_structure.py
          python3 Scripts/source_structure_lint.py

      - name: Run Swift Package Unit Tests
        run: |
          set -o pipefail
          swift test -v 2>&1 | tee swift_test.log || {
            STATUS=$?
            echo "### Swift Package Tests Failed (Exit $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 swift_test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          }
          echo "### Swift Package Tests Passed Successfully" >> $GITHUB_STEP_SUMMARY

      - name: Validate Xcode Project Build
        run: |
          set -o pipefail
          {
            echo "=== Discovering Installed Xcode SDKs ==="
            xcodebuild -showsdks || true
            echo "=== Inspecting Xcode Schemes & Targets ==="
            xcodebuild -list -project Yoru.xcodeproj || true
            echo "=== Discovering Available Build Destinations ==="
            xcodebuild -showdestinations -project Yoru.xcodeproj -scheme Yoru || true
          } > xcode_info.log 2>&1

          echo "=== Executing Xcode Build for iOS Simulator ==="
          xcodebuild build \
            -project Yoru.xcodeproj \
            -scheme Yoru \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO > xcodebuild.log 2>&1 || {
            STATUS=$?
            echo "### Xcode Build Failed (Exit $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 xcodebuild.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          }
          echo "### Xcode Build Succeeded Successfully" >> $GITHUB_STEP_SUMMARY

      - name: Emit Diagnostics as Warnings
        if: always()
        run: |
          if [ -f xcode_info.log ]; then
            cat xcode_info.log | head -n 25 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning title=XcodeInfo::$line"
            done
          fi
          if [ -f xcodebuild.log ]; then
            cat xcodebuild.log | tail -n 30 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning title=XcodeBuildLog::$line"
            done
          fi

      - name: Upload Build and Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            swift_test.log
            xcode_info.log
            xcodebuild.log
          if-no-files-found: ignore
