name: Official Telegram Baseline Build

on:
  push:
    branches: [ telegram-baseline, telegram-baseline-clean, master, main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Official Telegram iOS for Simulator
    runs-on: macos-15

    steps:
      - name: Checkout Codebase with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          echo "=== Diagnosing available Xcode versions and Simulator runtimes ==="
          ls -ld /Applications/Xcode* || true
          
          # Find the Xcode installation that has an iOS Simulator runtime available
          BEST_XCODE=""
          for xc in /Applications/Xcode.app /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$xc" ]; then
              echo "Inspecting $xc..."
              sudo xcode-select -s "$xc/Contents/Developer"
              RUNTIMES=$(xcrun simctl list runtimes || true)
              echo "$RUNTIMES"
              if echo "$RUNTIMES" | grep -q "iOS"; then
                echo ">>> Found iOS runtime in $xc <<<"
                BEST_XCODE="$xc"
                break
              fi
            fi
          done

          if [ -n "$BEST_XCODE" ]; then
            sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          else
            echo "Attempting to download iOS platform runtime for selected Xcode..."
            sudo xcodebuild -downloadPlatform iOS || true
          fi

          echo "Final Selected Xcode:"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Patch Bazel Rules for Xcode 16 Compatibility
        run: |
          echo "=== Patching Bazel rules for Xcode 16 version alignment ==="
          find build-system/bazel-rules -name "*.bzl" -exec sed -i '' 's/"26.0"/"16.0"/g' {} +
          echo "=== Patching plisttool to ignore expired fake provisioning profiles ==="
          sed -i '' 's/if expire and expire < datetime.datetime.now():/if False:/g' build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py

      - name: Setup Build Environment & Certificates
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs || echo "Certificate import warning: non-zero exit code, continuing..."

      - name: Execute Official Telegram Bazel Build
        run: |
          set -o pipefail
          mkdir -p "$HOME/telegram-bazel-cache"
          
          echo "=== Executing Make.py for debug_sim_arm64 ==="
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=debug_sim_arm64 \
            --buildNumber=100001 2>&1 | tee telegram_build.log || {
            STATUS=$?
            echo "### Telegram Baseline Build Failed (Exit Code: $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 telegram_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          }
          echo "### Telegram Baseline Build Succeeded Successfully" >> $GITHUB_STEP_SUMMARY

      - name: Verify Build Artifacts
        if: success()
        run: |
          echo "=== Inspecting Built Artifacts ==="
          ls -la bazel-bin/Telegram/ || true
          find bazel-bin -name "*.app" -o -name "*.ipa" || true

      - name: Publish Logs as Public Release Asset
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f telegram_build.log ]; then
            gh release create telegram-baseline-logs \
              telegram_build.log \
              --title "Telegram Baseline Build Logs" \
              --notes "Automated build logs from official Telegram baseline" || \
            gh release upload telegram-baseline-logs \
              telegram_build.log \
              --clobber || true
          fi

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-build-log
          path: telegram_build.log
          if-no-files-found: ignore
